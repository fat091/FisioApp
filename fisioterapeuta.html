<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FisioApp - Fisioterapeuta</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
<style>
body{background:#f1f5f9}
.sidebar{width:260px;background:#1e3a8a;min-height:100vh;color:#fff;position:fixed;padding:20px}
.main{margin-left:260px;padding:20px}
.menu a{display:block;color:#fff;text-decoration:none;padding:10px;border-radius:8px}
.menu a:hover{background:#2563eb}
.card-hover:hover{transform:translateY(-5px)}
</style>
</head>
<body>
<div class="sidebar">
<h3>FisioApp</h3>
<div id="usuarioInfo"></div><hr>
<div class="menu">
<a href="#"><i class="fa fa-users"></i> Pacientes</a>
<a href="sesiones.html">
<i class="fa fa-dumbbell"></i>
Sesiones
</a>
<a href="evolucion.html">
<i class="fa fa-chart-line"></i>
Evolución
</a>
<a href="resultados.html">
<i class="fa fa-file-medical"></i>
Resultados
</a>
<a href="#" onclick="cerrarSesion()"><i class="fa fa-right-from-bracket"></i> Salir</a>
</div>
</div>

<div class="main">
<div class="d-flex justify-content-between mb-3">
<h2>Panel del Fisioterapeuta</h2>
<button class="btn btn-primary"
onclick="nuevoPaciente()">
Nuevo Paciente
</button>
</div>

<div class="row mb-4">

<div class="col-md-4">

<div class="card p-3 shadow-sm">

<h5 id="totalPacientes">0</h5>

<small>Pacientes Activos</small>

</div>

</div>

<div class="col-md-4">

<div class="card p-3 shadow-sm">

<h5 id="totalInactivos">0</h5>

<small>Pacientes Inactivos</small>

</div>

</div>

<div class="col-md-4">

<div class="card p-3 shadow-sm">

<h5 id="totalGeneral">0</h5>

<small>Total Pacientes</small>

</div>

</div>

</div>
<input id="buscar" class="form-control mb-3" placeholder="Buscar paciente">

<table class="table table-striped bg-white">
<thead><tr>
<th>Nombre</th>
<th>Edad</th>
<th>Sexo</th>
<th>Diagnóstico</th>
<th>Teléfono</th>
<th>Estado</th>
<th>Acciones</th>
</tr></thead>
<tbody id="tablaPacientes"></tbody>
</table>
</div>

<div class="modal fade" id="pacienteModal">
<div class="modal-dialog modal-lg">
<div class="modal-content">
<div class="modal-header"><h5>Paciente</h5></div>
<div class="modal-body">
<input type="hidden" id="pacienteId">
<div class="row g-2">
<div class="col-md-6"><input id="nombre" class="form-control" placeholder="Nombre completo"></div>
<div class="col-md-2"><input id="edad" class="form-control" placeholder="Edad"></div>
<div class="col-md-4"><input id="sexo" class="form-control" placeholder="Sexo"></div>
<div class="col-md-3"><input id="peso" class="form-control" placeholder="Peso"></div>
<div class="col-md-3"><input id="estatura" class="form-control" placeholder="Estatura"></div>
<div class="col-md-6"><input id="diagnostico" class="form-control" placeholder="Diagnóstico"></div>
<div class="col-md-6"><input id="lateralidad" class="form-control" placeholder="Lateralidad"></div>
<div class="col-md-6"><input id="telefono" class="form-control" placeholder="Teléfono"></div>
<div class="col-md-6"><input id="correo" class="form-control" placeholder="Correo"></div>
<div class="col-md-6">
<input
id="usuarioPaciente"
class="form-control"
placeholder="Usuario Paciente">
</div>

<div class="col-md-6">
<input
id="passwordPaciente"
class="form-control"
placeholder="Contraseña Paciente">
</div>
<div class="col-md-12"><input id="direccion" class="form-control" placeholder="Dirección"></div>
<div class="col-md-12"><input id="tutor" class="form-control" placeholder="Tutor/Responsable"></div>
<div class="col-md-12"><textarea id="observaciones" class="form-control" placeholder="Observaciones"></textarea></div>
</div>
</div>
<div class="modal-footer">
<button class="btn btn-success" onclick="guardarPaciente()">Guardar</button>
</div>
</div>
</div>
</div>
<div class="col-md-6">
<input id="usuarioPaciente" class="form-control" placeholder="Usuario Paciente">
</div>

<div class="col-md-6">
<input id="passwordPaciente" class="form-control" placeholder="Contraseña">
</div>

<div class="col-md-6">
<input
id="passwordPaciente"
class="form-control"
placeholder="Contraseña">
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const usuario = JSON.parse(sessionStorage.getItem('usuarioActivo'));
if(!usuario){ location.href='login.html'; }
document.getElementById('usuarioInfo').innerHTML='👤 '+usuario.nombre+'<br>'+usuario.rol;

function obtenerPacientes(){
 return JSON.parse(localStorage.getItem('pacientes'))||[];
}

function guardarLista(lista){
 localStorage.setItem('pacientes',JSON.stringify(lista));
}

function render(){
 let pacientes=obtenerPacientes().filter(p=>p.fisioterapeuta===usuario.usuario);
 let b=document.getElementById('buscar').value?.toLowerCase()||'';
 pacientes=pacientes.filter(p=>p.nombre.toLowerCase().includes(b));
 document.getElementById('totalPacientes').innerText=pacientes.filter(p=>p.estado==='Activo').length;
 document.getElementById('totalInactivos').innerText =
pacientes.filter(
p=>p.estado==='Inactivo'
).length;

document.getElementById('totalGeneral').innerText =
pacientes.length;
 document.getElementById('tablaPacientes').innerHTML=pacientes.map(p=>`
 <tr>
<td>${p.nombre}</td>
<td>${p.edad}</td>
<td>${p.sexo}</td>
<td>${p.diagnostico}</td>
<td>${p.telefono}</td>
<td>
<span class="badge ${
p.estado==='Activo'
? 'bg-success'
: 'bg-danger'
}">
${p.estado}
</span>
</td>
<td>

 <button
 class='btn btn-primary btn-sm'
 onclick='verExpediente(${p.id})'>

 Ver Expediente

 </button>

 <button
class='btn btn-success btn-sm'
onclick='verSesiones(${p.id})'>

Sesiones

</button>

 <button
 class='btn btn-warning btn-sm'
 onclick='editar(${p.id})'>

 Editar

 <button
class='btn btn-${p.estado==="Activo" ? "danger" : "success"} btn-sm'
onclick='cambiarEstado(${p.id})'>

${p.estado==="Activo" ? "Desactivar" : "Activar"}

</button>

<button
class='btn btn-dark btn-sm'
onclick='eliminarPaciente(${p.id})'>

Eliminar

</button>

</td>

</tr>`).join('');
}



function guardarPaciente(){

    let lista = obtenerPacientes();
    const campos = [
    "nombre",
    "edad",
    "sexo",
    "peso",
    "estatura",
    "diagnostico",
    "lateralidad",
    "telefono",
    "correo",
    "direccion",
    "tutor",
    "usuarioPaciente",
    "passwordPaciente",
    "observaciones"
];

for(const idCampo of campos){

    const valor = document.getElementById(idCampo).value.trim();

    if(valor === ""){

        alert("Debe completar el campo: " + idCampo);

        document.getElementById(idCampo).focus();

        return;

    }

}

    let id = Number(
        document.getElementById("pacienteId").value
    );

    let p = {

        id: id ? id : Date.now(),

        fisioterapeuta: usuario.usuario,

        nombre: nombre.value,
        edad: edad.value,
        sexo: sexo.value,
        peso: peso.value,
        estatura: estatura.value,
        diagnostico: diagnostico.value,
        lateralidad: lateralidad.value,
        telefono: telefono.value,
        correo: correo.value,
        direccion: direccion.value,
        tutor: tutor.value,
        observaciones: observaciones.value,

        usuarioPaciente:
        document.getElementById("usuarioPaciente").value,

        passwordPaciente:
        document.getElementById("passwordPaciente").value,

        estado:"Activo"

    };

    if(id){

        let indice =
        lista.findIndex(x => x.id == id);

        p.estado = lista[indice].estado;

        lista[indice] = p;

    }else{

        lista.push(p);

        let usuarios =
        JSON.parse(
            localStorage.getItem("usuarios")
        ) || [];

        usuarios.push({

            id: Date.now()+1,

            nombre: p.nombre,

            correo: p.correo,

            usuario: p.usuarioPaciente,

            password: p.passwordPaciente,

            rol: "Paciente"

        });

        localStorage.setItem(
            "usuarios",
            JSON.stringify(usuarios)
        );

    }

    guardarLista(lista);

    bootstrap.Modal
    .getInstance(
        document.getElementById("pacienteModal")
    ).hide();

    document.querySelectorAll(
        "#pacienteModal input,#pacienteModal textarea"
    ).forEach(campo=>campo.value="");

    document.getElementById(
        "pacienteId"
    ).value="";

    render();

}


function editar(id){

    let p = obtenerPacientes().find(
        x => x.id === id
    );

    if(!p) return;
document.getElementById("usuarioPaciente").value =
p.usuarioPaciente || "";

document.getElementById("passwordPaciente").value =
p.passwordPaciente || "";
    document.getElementById("pacienteId").value = p.id;

    document.getElementById("nombre").value = p.nombre || "";
    document.getElementById("edad").value = p.edad || "";
    document.getElementById("sexo").value = p.sexo || "";
    document.getElementById("peso").value = p.peso || "";
    document.getElementById("estatura").value = p.estatura || "";
    document.getElementById("diagnostico").value = p.diagnostico || "";
    document.getElementById("lateralidad").value = p.lateralidad || "";
    document.getElementById("telefono").value = p.telefono || "";
    document.getElementById("correo").value = p.correo || "";
    document.getElementById("direccion").value = p.direccion || "";
    document.getElementById("tutor").value = p.tutor || "";
    document.getElementById("observaciones").value = p.observaciones || "";

    new bootstrap.Modal(
        document.getElementById("pacienteModal")
    ).show();
    

}

function cambiarEstado(id){

    let lista = obtenerPacientes();

    let paciente = lista.find(
        p => p.id == id
    );

    if(!paciente) return;

    if(paciente.estado === "Activo"){

        paciente.estado = "Inactivo";

    }else{

        paciente.estado = "Activo";

    }

    guardarLista(lista);

    render();

}
function eliminarPaciente(id){

    if(!confirm("¿Seguro que deseas eliminar este paciente?")){
        return;
    }

    let lista = obtenerPacientes();

    lista = lista.filter(
        paciente => paciente.id !== id
    );

    guardarLista(lista);

    render();

}
function verExpediente(id){

    window.location.href =
    "expediente.html?id=" + id;

}
function verSesiones(id){

    window.location.href =
    "sesiones.html?id=" + id;

}

function cerrarSesion(){
 sessionStorage.clear();
 location.href='login.html';
}

function nuevoPaciente(){

    document.getElementById("pacienteId").value = "";

    document.querySelectorAll(
        "#pacienteModal input,#pacienteModal textarea"
    ).forEach(campo => {

        if(campo.id !== "pacienteId"){
            campo.value = "";
        }

    });

    new bootstrap.Modal(
        document.getElementById("pacienteModal")
    ).show();

}
buscar.addEventListener('input',render);
render();

</script>
</body>
</html>
