<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>FisioApp - Sesiones</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

<style>

body{
    background:#f1f5f9;
}

.sidebar{
    width:260px;
    background:#1e3a8a;
    min-height:100vh;
    position:fixed;
    color:white;
    padding:20px;
}

.sidebar h3{
    text-align:center;
    margin-bottom:20px;
}

.menu a{
    display:block;
    color:white;
    text-decoration:none;
    padding:12px;
    border-radius:10px;
    margin-bottom:10px;
}

.menu a:hover{
    background:#2563eb;
}

.main{
    margin-left:260px;
    padding:25px;
}

.card-custom{
    border:none;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

</style>

</head>

<body>

<div class="sidebar">

    <h3>FisioApp</h3>

    <div class="menu">

        <a href="fisioterapeuta.html">

            <i class="fa fa-arrow-left"></i>
            Volver

        </a>

    </div>

</div>

<div class="main animate__animated animate__fadeIn">

    <h2 class="mb-4">

        <i class="fa fa-dumbbell"></i>
        Registro de Sesiones

    </h2>

    <div id="datosPaciente"></div>

</div>

<script>

const idPaciente =
new URLSearchParams(
window.location.search
).get("id");

const pacientes =
JSON.parse(
localStorage.getItem("pacientes")
) || [];

const paciente =
pacientes.find(
p => p.id == idPaciente
);

if(!paciente){

    alert("Paciente no encontrado");

    location.href =
    "fisioterapeuta.html";

}

document.getElementById(
"datosPaciente"
).innerHTML = `

<div class="card card-custom p-4 mb-4">

    <h4>${paciente.nombre}</h4>

    <p>
        Edad: ${paciente.edad}
        |
        Diagnóstico:
        ${paciente.diagnostico}
    </p>

</div>

<div class="card card-custom p-4 mb-4">

    <h4>Registrar Sesión</h4>

    <div class="row">

        <div class="col-md-3 mb-3">

            <label>Fecha</label>

            <input
            type="date"
            id="fecha"
            class="form-control">

        </div>

        <div class="col-md-3 mb-3">

            <label>Ejercicio</label>

            <select
            id="ejercicio"
            class="form-control">

                <option>Elevación de brazo</option>
                <option>Extensión</option>
                <option>Movimiento lateral</option>
                <option>Alcance frontal</option>
                <option>Movimiento circular</option>

            </select>

        </div>

        <div class="col-md-3 mb-3">

            <label>Duración (min)</label>

            <input
            type="number"
            id="duracion"
            class="form-control">

        </div>

        <div class="col-md-3 mb-3">

            <label>Desempeño (%)</label>

            <input
            type="number"
            id="porcentaje"
            class="form-control">

        </div>

        <div class="col-md-12 mb-3">

            <label>Observaciones</label>

            <textarea
            id="observaciones"
            class="form-control"></textarea>

        </div>

    </div>

    <button
    class="btn btn-success"
    onclick="guardarSesion()">

        Guardar Sesión

    </button>

</div>

<div class="card card-custom p-4">

    <h4>Historial de Sesiones</h4>

    <div id="tablaSesiones"></div>

</div>

`;
function obtenerSesiones(){

    return JSON.parse(
        localStorage.getItem("sesiones")
    ) || [];

}

function guardarSesion(){

    let sesiones =
    obtenerSesiones();

    let porcentaje =
    Number(
        document.getElementById("porcentaje").value
    );

    let nivel = "";
    let semaforo = "";
    let recomendacion = "";

    if(porcentaje < 50){

        nivel = "Bajo";
        semaforo = "🔴";

        recomendacion =
        "Incrementar supervisión y repetir ejercicios básicos.";

    }else if(porcentaje < 80){

        nivel = "Medio";
        semaforo = "🟡";

        recomendacion =
        "Mantener plan terapéutico actual.";

    }else{

        nivel = "Alto";
        semaforo = "🟢";

        recomendacion =
        "Continuar progresión de ejercicios.";

    }

    sesiones.push({

        id: Date.now(),

        pacienteId: paciente.id,

        fecha:
        document.getElementById("fecha").value,

        ejercicio:
        document.getElementById("ejercicio").value,

        duracion:
        document.getElementById("duracion").value,

        porcentaje: porcentaje,

        nivel: nivel,

        semaforo: semaforo,

        observaciones:
        document.getElementById("observaciones").value,

        recomendacion:
        recomendacion

    });

    localStorage.setItem(
        "sesiones",
        JSON.stringify(sesiones)
    );

    mostrarSesiones();

    alert(
        "Sesión guardada correctamente"
    );

}
function mostrarSesiones(){

    let sesiones =
    obtenerSesiones().filter(

        s =>

        s.pacienteId == paciente.id

    );

    document.getElementById(
        "tablaSesiones"
    ).innerHTML = `

    <table class="table table-striped">

        <thead>

            <tr>

                <th>Fecha</th>
                <th>Ejercicio</th>
                <th>%</th>
                <th>Nivel</th>
                <th>Semáforo</th>
                <th>Recomendación</th>

            </tr>

        </thead>

        <tbody>

        ${sesiones.map(s=>`

            <tr>

                <td>${s.fecha}</td>

                <td>${s.ejercicio}</td>

                <td>${s.porcentaje}%</td>

                <td>${s.nivel}</td>

                <td>${s.semaforo}</td>

                <td>${s.recomendacion}</td>

            </tr>

        `).join("")}

        </tbody>

    </table>

    `;

}

mostrarSesiones();
</script>

</body>
</html>
