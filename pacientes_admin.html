<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pacientes - Administrador</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{

background:#f1f5f9;

}

.container{

margin-top:40px;

}

.card{

border:none;

border-radius:15px;

box-shadow:0 5px 15px rgba(0,0,0,.08);

}

h2{

color:#1e3a8a;

margin-bottom:25px;

}

</style>

</head>

<body>

<div class="container">

<div class="card p-4">

<h2>

<i class="fa-solid fa-users"></i>

Pacientes Registrados

</h2>

<table class="table table-hover" id="tablaPacientes">

<thead class="table-primary">

<tr>

<th>Nombre</th>

<th>Edad</th>

<th>Diagnóstico</th>

<th>Fisioterapeuta</th>

<th>Estado</th>

<th>Acción</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

<a href="dashboard.html"
class="btn btn-primary">

<i class="fa-solid fa-arrow-left"></i>

Volver

</a>

</div>

</div>

<script>

const pacientes =

JSON.parse(

localStorage.getItem("pacientes")

) || [];

let html = "";

pacientes.forEach(p=>{

html += `

<tr>

<td>${p.nombre}</td>

<td>${p.edad}</td>

<td>${p.diagnostico}</td>

<td>${p.fisioterapeuta}</td>

<td>

<span class="badge bg-${p.estado==="Activo"?"success":"danger"}">

${p.estado}

</span>

</td>

<td>

<button
class="btn btn-info btn-sm"
onclick="verPaciente(${p.id})">

<i class="fa-solid fa-eye"></i>

</button>

</td>

</tr>

`;

});

document.querySelector("#tablaPacientes tbody").innerHTML = html;

function verPaciente(id){

localStorage.setItem(

"pacienteSeleccionado",

id

);

window.location.href =

"expediente.html";

}

</script>

</body>
</html>
